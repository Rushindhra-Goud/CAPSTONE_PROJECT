services:
  # ---------- Backend (FastAPI) ----------
  - type: web
    name: saferoute-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python load_data.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: CORS_ORIGINS
        sync: false        # you'll be asked: your frontend URL, e.g. https://saferoute-web.onrender.com
      - key: OWM_API_KEY
        sync: false        # you'll be asked: OpenWeatherMap key (leave blank to skip live weather)

  # ---------- Frontend (React + Vite static site) ----------
  - type: web
    name: saferoute-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_URL
        sync: false        # you'll be asked: your backend URL, e.g. https://saferoute-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
